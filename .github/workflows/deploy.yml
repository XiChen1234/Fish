name: Deploy

on:
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: deploy
  # 部署串行执行：避免新推送取消正在进行的部署，留下半完成的 .new/回滚状态
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build linux-amd64 binary
        env:
          CGO_ENABLED: 0
          GOPROXY: https://proxy.golang.org,direct
        run: |
          go build -trimpath -ldflags "-s -w" -o dist/fish-server ./cmd/server
          echo "Binary size: $(stat -c%s dist/fish-server) bytes"

      # 先上传到临时目录，再由远程脚本原子替换 /opt/fish/fish-server
      - name: Upload binary to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          port: 22
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: dist/fish-server
          target: /tmp/fish-upload
          strip_components: 1
          overwrite: true

      - name: Idempotent init + replace + restart
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          port: 22
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script_stop: true
          script: |
            set -e

            # ---------- 1. 幂等初始化（第一次部署自动完成，后续幂等 no-op） ----------
            if ! id -u fish >/dev/null 2>&1; then
              useradd --system --no-create-home --shell /usr/sbin/nologin fish
              echo "+ 创建 fish 运行用户 (UID=$(id -u fish))"
            fi
            mkdir -p /opt/fish
            chown fish:fish /opt/fish

            # systemd 服务单元（每次覆盖，保证与仓库版本一致）
            # 不依赖 config.json：监听地址由命令行参数给定，数据目录默认 /opt/fish/data。
            # 若服务器上存在 /opt/fish/config.json 仍会被读取（用于调整大小上限等）。
            cat > /etc/systemd/system/fish.service <<'UNIT'
            [Unit]
            Description=Fish private messaging server (single room, dynamic pairing)
            After=network-online.target
            Wants=network-online.target

            [Service]
            Type=simple
            WorkingDirectory=/opt/fish
            ExecStart=/opt/fish/fish-server -config /opt/fish/config.json -listen :19090
            Restart=on-failure
            RestartSec=3
            MemoryMax=256M
            CPUQuota=100%
            User=fish
            Group=fish
            NoNewPrivileges=true
            ProtectSystem=strict
            ReadWritePaths=/opt/fish
            PrivateTmp=true

            [Install]
            WantedBy=multi-user.target
            UNIT
            systemctl daemon-reload
            echo "+ systemd 单元就绪"

            # ---------- 2. 原子替换 ----------
            if [ ! -f /tmp/fish-upload/fish-server ]; then
              echo "✗ 未找到上传的二进制 /tmp/fish-upload/fish-server"
              exit 1
            fi
            if [ -f /opt/fish/fish-server ]; then
              cp -a /opt/fish/fish-server /opt/fish/fish-server.bak
            fi
            mv /tmp/fish-upload/fish-server /opt/fish/fish-server.new
            # 同分区 rename 才是原子替换；跨分区（/tmp → /opt）先落到 .new 再 rename
            mv /opt/fish/fish-server.new /opt/fish/fish-server
            chmod 755 /opt/fish/fish-server
            chown fish:fish /opt/fish/fish-server
            echo "+ 二进制已替换（旧版本已备份为 fish-server.bak）"

            # ---------- 3. 启用开机自启 + 重启 ----------
            systemctl enable fish
            systemctl restart fish
            sleep 2

            if systemctl is-active fish >/dev/null 2>&1; then
              echo "✓ fish 启动成功"
              systemctl --no-pager --full status fish | head -10
              echo "--- 健康检查 ---"
              curl -fsS http://127.0.0.1:19090/healthz || echo "⚠ /healthz 不可达"
            else
              echo "✗ fish 启动失败，自动回滚..."
              journalctl -u fish --no-pager -n 30 || true
              if [ -f /opt/fish/fish-server.bak ]; then
                mv /opt/fish/fish-server.bak /opt/fish/fish-server
                chmod 755 /opt/fish/fish-server
                systemctl restart fish || true
                if systemctl is-active fish >/dev/null 2>&1; then
                  echo "✓ 回滚成功，旧二进制已启动"
                fi
              fi
              exit 1
            fi
