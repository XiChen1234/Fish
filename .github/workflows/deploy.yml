name: Deploy

on:
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.23

      - name: Build linux-amd64 binary
        env:
          CGO_ENABLED: 0
          GOPROXY: https://proxy.golang.org,direct
        run: |
          go build -trimpath -ldflags "-s -w" -o dist/fish-server ./cmd/server
          echo "Binary size: $(stat -c%s dist/fish-server) bytes"

      - name: Upload binary & restart service
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script_stop: true
          # 先备份当前二进制，再上传新文件，再重启服务
          scp: true
          scp_file: dist/fish-server
          scp_target: /opt/fish/fish-server.new
          script: |
            set -e
            # 备份（不存在则跳过）
            if [ -f /opt/fish/fish-server ]; then
              cp -a /opt/fish/fish-server /opt/fish/fish-server.bak
            fi
            # 原子替换
            mv /opt/fish/fish-server.new /opt/fish/fish-server
            chmod 755 /opt/fish/fish-server
            # systemd 重启；若服务尚未安装，提示用户先跑 server-init.sh
            if systemctl is-enabled fish >/dev/null 2>&1; then
              systemctl restart fish
              sleep 2
              if systemctl is-active fish >/dev/null 2>&1; then
                echo "✓ fish 启动成功"
                systemctl --no-pager --full status fish | head -10
              else
                echo "✗ fish 启动失败，回滚..."
                journalctl -u fish --no-pager -n 30 || true
                mv /opt/fish/fish-server.bak /opt/fish/fish-server
                systemctl restart fish
                exit 1
              fi
            else
              echo "⚠ fish 服务未安装，请先在服务器上运行 deploy/server-init.sh"
            fi
