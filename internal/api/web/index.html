<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fish 私信</title>
<style>
  :root {
    --bg: #0f1419; --panel: #1a2129; --panel2: #202a35;
    --text: #e6ecef; --muted: #8b98a5; --accent: #4aa3ff;
    --mine: #2b5278; --theirs: #26333d; --ok: #3fb950; --err: #f85149;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    background: var(--bg); color: var(--text); height: 100vh;
    display: flex; flex-direction: column;
  }
  header {
    padding: 10px 16px; background: var(--panel); border-bottom: 1px solid #2a3441;
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  }
  header h1 { font-size: 16px; font-weight: 600; }
  #status { font-size: 12px; color: var(--muted); }
  #status .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--err); margin-right: 4px; }
  #status.on .dot { background: var(--ok); }
  header .spacer { flex: 1; }
  header button { background: var(--panel2); color: var(--text); border: 1px solid #32404e; border-radius: 6px; padding: 5px 12px; cursor: pointer; font-size: 12px; }
  header button:hover { border-color: var(--accent); }

  /* 配置面板 */
  #setup {
    margin: auto; background: var(--panel); padding: 28px; border-radius: 12px;
    width: min(360px, 90vw); display: flex; flex-direction: column; gap: 12px;
    border: 1px solid #2a3441;
  }
  #setup h2 { font-size: 15px; }
  #setup label { font-size: 12px; color: var(--muted); }
  #setup input {
    background: var(--panel2); border: 1px solid #32404e; color: var(--text);
    border-radius: 6px; padding: 8px 10px; font-size: 13px;
  }
  #setup input:focus { outline: none; border-color: var(--accent); }
  #setup button {
    background: var(--accent); color: #fff; border: none; border-radius: 6px;
    padding: 9px; font-size: 14px; cursor: pointer; margin-top: 4px;
  }
  #setup .hint { font-size: 11px; color: var(--muted); line-height: 1.6; }

  /* 聊天区 */
  #chat { display: none; flex-direction: column; flex: 1; min-height: 0; }
  #msgs { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 8px; }
  .row { display: flex; }
  .row.mine { justify-content: flex-end; }
  .bubble {
    max-width: 72%; padding: 8px 12px; border-radius: 10px; background: var(--theirs);
    font-size: 14px; line-height: 1.45; word-break: break-word;
  }
  .row.mine .bubble { background: var(--mine); }
  .bubble img { max-width: 100%; max-height: 300px; border-radius: 6px; display: block; cursor: pointer; }
  .meta { font-size: 10px; color: var(--muted); margin-top: 3px; }
  #more { margin: 4px auto; font-size: 12px; color: var(--accent); background: none; border: none; cursor: pointer; }

  footer { display: flex; gap: 8px; padding: 12px 16px; background: var(--panel); border-top: 1px solid #2a3441; }
  #input {
    flex: 1; background: var(--panel2); border: 1px solid #32404e; color: var(--text);
    border-radius: 8px; padding: 10px 12px; font-size: 14px; resize: none; height: 42px;
  }
  #input:focus { outline: none; border-color: var(--accent); }
  footer button {
    background: var(--accent); color: #fff; border: none; border-radius: 8px;
    padding: 0 18px; font-size: 14px; cursor: pointer;
  }
  #pick { display: none; }
  .icon-btn {
    background: var(--panel2); border: 1px solid #32404e; color: var(--text);
    border-radius: 8px; padding: 0 14px; font-size: 16px; cursor: pointer;
  }
</style>
</head>
<body>
  <header>
    <h1>Fish 私信</h1>
    <span id="status"><span class="dot"></span>未连接</span>
    <span class="spacer"></span>
    <button id="toggle-setup" style="display:none">连接设置</button>
  </header>

  <!-- 配置面板 -->
  <div id="setup">
    <h2>连接服务器</h2>
    <div>
      <label>服务器地址</label>
      <input id="addr" placeholder="http://服务器IP:8080">
    </div>
    <div>
      <label>密钥（token）</label>
      <input id="token" type="password" placeholder="config.json 中的 endpoints token">
    </div>
    <button id="connect">连接</button>
    <p class="hint">
      密钥见服务端 config.json 的 endpoints 列表。<br>
      客户端 A、B 各自使用不同 token 登录即互为对端。
    </p>
  </div>

  <!-- 聊天界面 -->
  <div id="chat">
    <div id="msgs"></div>
    <footer>
      <input type="file" id="pick" accept="image/jpeg,image/png,image/gif,image/webp">
      <button class="icon-btn" id="img-btn" title="发送图片">🖼</button>
      <textarea id="input" placeholder="输入消息，Enter 发送"></textarea>
      <button id="send">发送</button>
    </footer>
  </div>

<script>
const $ = id => document.getElementById(id);
const state = {
  ws: null, token: '', you: '', peer: '', peerOnline: false,
  ready: false,   // 是否已收到 ready（用于区分「鉴权/连通性失败」与「连上后掉线」）
  // 本地已收到游标：必须与「已渲染的气泡」同生命周期，因此只存内存、不持久化。
  // 刷新页面后 DOM 清空，游标必须归零，否则 sync 只拉增量，历史消息不再显示。
  localSeq: 0,
  serverSeq: 0,   // 服务端当前最大 seq（仅用于判断是否落后）
  syncing: false, // 是否正在补拉历史
  pending: new Map() // 乐观气泡 ref -> bubble 元素
};

// ---- 本地记忆（只记地址与密钥，不记游标）----
function saveCfg() {
  localStorage.setItem('fish.cfg', JSON.stringify({
    addr: $('addr').value, token: $('token').value
  }));
}
function loadCfg() {
  try { return JSON.parse(localStorage.getItem('fish.cfg')) || {}; } catch { return {}; }
}

// ---- 状态栏 ----
function setStatus(on, text) {
  const el = $('status');
  el.classList.toggle('on', on);
  el.innerHTML = `<span class="dot"></span>${text}`;
}

// ---- 消息渲染 ----
function bubble(m, mine) {
  const row = document.createElement('div');
  row.className = 'row' + (mine ? ' mine' : '');
  if (m.seq && m.seq !== '…') row.dataset.seq = m.seq;
  const b = document.createElement('div');
  b.className = 'bubble';
  if (m.kind === 'image') {
    const img = document.createElement('img');
    img.src = apiBase() + '/api/files/' + m.file_id + '?token=' + encodeURIComponent(state.token);
    img.onclick = () => window.open(img.src);
    b.appendChild(img);
    const meta = document.createElement('div');
    meta.className = 'meta';
    meta.textContent = `图片 ${m.w || '?'}x${m.h || '?'} · ${fmtSize(m.size)}`;
    b.appendChild(meta);
  } else {
    b.textContent = m.body;
  }
  const meta = document.createElement('div');
  meta.className = 'meta';
  meta.textContent = `${mine ? '我' : (m.from === 'a' ? 'A' : 'B')} · ${fmtTime(m.ts)} · #${m.seq}`;
  b.appendChild(meta);
  row.appendChild(b);
  return row;
}
function fmtTime(ts) {
  const d = ts ? new Date(ts) : new Date();
  return d.toLocaleTimeString('zh-CN', { hour12: false });
}
function fmtSize(n) {
  if (!n) return '';
  return n < 1024 ? n + 'B' : (n / 1024).toFixed(1) + 'KB';
}
function append(el) {
  $('msgs').appendChild(el);
  $('msgs').scrollTop = $('msgs').scrollHeight;
}
function apiBase() {
  return document.getElementById('addr').value.trim().replace(/\/+$/, '');
}

// ---- 游标与去重 ----
// 本地游标只做「连续性推进」：遇到空洞（seq 跳跃）时停在原处，
// 后续由 sync 补回缺失消息后再依次推进，避免误跳过未收到的消息。
function markSeq(seq) {
  if (!seq || seq === '…') return;
  if (seq <= state.localSeq || seq > state.localSeq + 1) return;
  state.localSeq = seq;
}

// 该 seq 是否已在页面上渲染过（重连补拉时避免重复气泡）
function hasRendered(seq) {
  return !!$('msgs').querySelector('[data-seq="' + seq + '"]');
}

// 渲染一条服务端消息：按 seq 幂等去重，返回是否新渲染
function receiveMessage(m) {
  if (m.seq <= state.localSeq || hasRendered(m.seq)) {
    markSeq(m.seq);
    return false;
  }
  append(bubble(m, m.from === state.you));
  markSeq(m.seq);
  return true;
}

function updateStatus() {
  setStatus(state.ws && state.ws.readyState === 1,
    `身份 ${state.you.toUpperCase()} · 对端 ${state.peer.toUpperCase()} ${state.peerOnline ? '在线' : '离线'}`);
}

// ---- 连接 ----
function connect() {
  const token = $('token').value.trim();
  if (!token) { alert('请输入密钥'); return; }

  // 游标与消息区必须同生命周期：切换身份时清空已渲染气泡并归零游标，
  // 否则新身份的 sync 会从旧游标开始，漏掉它的历史消息。
  if (token !== state.token) {
    state.token = token;
    state.localSeq = 0;
    state.serverSeq = 0;
    $('msgs').innerHTML = '';
  }
  state.syncing = false;
  state.pending.clear();
  state.ready = false;

  const wsURL = apiBase().replace(/^http/, 'ws') + '/ws?token=' + encodeURIComponent(state.token);
  try { state.ws = new WebSocket(wsURL); }
  catch (e) { alert('地址格式错误，应为 http://IP:端口'); return; }

  state.ws.onopen = () => setStatus(true, '已连接，等待就绪…');
  state.ws.onmessage = ev => { try { handleFrame(JSON.parse(ev.data)); } catch {} };
  state.ws.onclose = () => {
    const wasReady = state.ready;
    state.ready = false;
    setStatus(false, '连接断开');
    state.syncing = false;
    $('toggle-setup').style.display = '';
    if (!wasReady) {
      // 未收到 ready 即关闭：浏览器读不到 WS 握手的 HTTP 状态码，
      // 此时只能是密钥无效或服务器不可达，明确提示并回到配置面板。
      $('setup').style.display = 'flex';
      alert('连接失败：密钥无效或服务器不可达\n请检查「服务器地址」与「密钥」是否正确');
    }
  };
  state.ws.onerror = () => setStatus(false, '连接失败');

  saveCfg();
}

function onReady() {
  $('setup').style.display = 'none';
  $('chat').style.display = 'flex';
  $('toggle-setup').style.display = '';
  updateStatus();
  // 用「本地游标」补拉历史：localSeq 只统计当前页面已渲染的消息，
  // 刷新后为 0 → 全量重拉；同一页面内断线重连 → 仅补拉增量。
  // 绝不能用 ready.last_seq 覆盖本地游标。
  loadHistory();
}

function loadHistory() {
  if (state.syncing) return;
  state.syncing = true;
  sendFrame({ v: 1, type: 'sync', data: { after: state.localSeq, limit: 200 } });
}

function sendFrame(f) {
  if (state.ws && state.ws.readyState === 1) state.ws.send(JSON.stringify(f));
}

// ---- 帧处理 ----
function handleFrame(f) {
  switch (f.type) {
    case 'ready': {
      const d = f.data;
      state.ready = true;
      state.you = d.you;
      state.peer = d.peer;
      state.peerOnline = !!d.peer_online;
      state.serverSeq = d.last_seq || 0; // 服务端游标，仅记录，不覆盖本地游标
      onReady();
      break;
    }
    case 'msg.new': {
      const m = f.data;
      receiveMessage(m);
      // 无论是否重复都回 ack（幂等）
      sendFrame({ v: 1, type: 'msg.ack', data: { seq: m.seq } });
      break;
    }
    case 'sync.done': {
      state.syncing = false;
      const d = f.data || {};
      for (const m of (d.msgs || [])) receiveMessage(m);
      if (d.has_more) loadHistory(); // 继续下一页
      break;
    }
    case 'presence': {
      const d = f.data || {};
      if (d.peer === state.peer) {
        state.peerOnline = !!d.online;
        updateStatus();
      }
      break;
    }
    case 'msg.ack': {
      // 回填乐观气泡的真实 seq
      const d = f.data || {};
      if (d.ref) {
        const el = state.pending.get(d.ref);
        if (el) {
          if (d.seq) {
            el.dataset.seq = d.seq;
            const meta = el.querySelector('.meta');
            if (meta) meta.textContent = meta.textContent.replace('#…', '#' + d.seq);
            markSeq(d.seq);
          }
          state.pending.delete(d.ref);
        }
      }
      break;
    }
    case 'msg.delivered':
      break; // UI 简化：不单独渲染回执
    case 'pong':
      break;
    case 'error': {
      const d = f.data || {};
      if (d.ref && state.pending.has(d.ref)) {
        // 服务端拒绝的消息：撤回乐观气泡，避免「界面显示已发送」的误解
        state.pending.get(d.ref).remove();
        state.pending.delete(d.ref);
        alert('发送失败: ' + (d.message || '未知错误'));
        return;
      }
      console.error('服务端错误', d);
      alert('服务端错误 ' + d.code + ': ' + d.message);
      break;
    }
  }
}

// ---- 发送 ----
async function sendText() {
  const text = $('input').value.trim();
  if (!text || !state.ws) return;
  $('input').value = '';
  const ref = 's' + Date.now() + Math.random().toString(36).slice(2, 6);
  const el = bubble({ kind: 'text', body: text, ts: Date.now(), seq: '…', from: state.you }, true);
  state.pending.set(ref, el);
  append(el); // 乐观渲染，收到 msg.ack 后回填 seq
  sendFrame({ v: 1, type: 'msg.send', id: ref, data: { kind: 'text', body: text } });
}

async function sendImage(file) {
  if (!file) return;
  const fd = new FormData();
  fd.append('file', file);
  try {
    const resp = await fetch(apiBase() + '/api/files', {
      method: 'POST',
      headers: { 'Authorization': 'Bearer ' + state.token },
      body: fd
    });
    if (!resp.ok) throw new Error('上传失败 http=' + resp.status);
    const d = await resp.json();
    const ref = 'i' + Date.now() + Math.random().toString(36).slice(2, 6);
    const el = bubble({ kind: 'image', file_id: d.file_id, size: d.size, ts: Date.now(), seq: '…', from: state.you }, true);
    state.pending.set(ref, el);
    append(el);
    sendFrame({
      v: 1, type: 'msg.send', id: ref,
      data: { kind: 'image', file_id: d.file_id, size: d.size }
    });
  } catch (e) {
    alert(e.message || '图片上传失败');
  }
}

// ---- 事件绑定 ----
$('connect').onclick = connect;
$('send').onclick = sendText;
$('input').addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendText(); }
});
$('img-btn').onclick = () => $('pick').click();
$('pick').onchange = e => { if (e.target.files[0]) sendImage(e.target.files[0]); e.target.value = ''; };
$('toggle-setup').onclick = () => {
  const s = $('setup');
  s.style.display = s.style.display === 'none' ? 'flex' : 'none';
};

// 初始化填充历史配置
(function init() {
  const cfg = loadCfg();
  if (cfg.addr) $('addr').value = cfg.addr;
  if (cfg.token) $('token').value = cfg.token;
  if (!cfg.addr) {
    $('addr').value = location.origin.startsWith('http') ? location.origin : 'http://' + location.host;
  }
})();

// 心跳保活
setInterval(() => sendFrame({ v: 1, type: 'ping' }), 30000);
</script>
</body>
</html>
