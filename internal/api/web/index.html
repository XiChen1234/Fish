<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fish 私信</title>
<style>
  :root {
    --bg: #0f1419; --panel: #1a2129; --panel2: #202a35;
    --text: #e6ecef; --muted: #8b98a5; --accent: #4aa3ff;
    --mine: #2b5278; --theirs: #26333d; --ok: #3fb950; --err: #f85149;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    background: var(--bg); color: var(--text); height: 100vh;
    display: flex; flex-direction: column;
  }
  header {
    padding: 10px 16px; background: var(--panel); border-bottom: 1px solid #2a3441;
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  }
  header h1 { font-size: 16px; font-weight: 600; }
  #status { font-size: 12px; color: var(--muted); }
  #status .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--err); margin-right: 4px; }
  #status.on .dot { background: var(--ok); }
  header .spacer { flex: 1; }
  header button { background: var(--panel2); color: var(--text); border: 1px solid #32404e; border-radius: 6px; padding: 5px 12px; cursor: pointer; font-size: 12px; }
  header button:hover { border-color: var(--accent); }

  /* 配置面板 */
  #setup {
    margin: auto; background: var(--panel); padding: 28px; border-radius: 12px;
    width: min(400px, 92vw); display: flex; flex-direction: column; gap: 12px;
    border: 1px solid #2a3441;
  }
  #setup h2 { font-size: 15px; }
  #setup label { font-size: 12px; color: var(--muted); }
  #setup input, #setup select {
    background: var(--panel2); border: 1px solid #32404e; color: var(--text);
    border-radius: 6px; padding: 8px 10px; font-size: 13px;
  }
  #setup input:focus, #setup select:focus { outline: none; border-color: var(--accent); }
  #setup button.primary {
    background: var(--accent); color: #fff; border: none; border-radius: 6px;
    padding: 9px; font-size: 14px; cursor: pointer; margin-top: 4px;
  }
  #setup button.primary:hover { filter: brightness(1.1); }
  #setup button.secondary {
    background: transparent; color: var(--accent); border: 1px solid var(--accent);
    border-radius: 6px; padding: 7px; font-size: 13px; cursor: pointer;
  }
  #setup .row2 { display: flex; gap: 8px; }
  #setup .hint { font-size: 11px; color: var(--muted); line-height: 1.6; }
  #setup .err { font-size: 12px; color: var(--err); min-height: 14px; }

  /* 聊天区 */
  #chat { display: none; flex-direction: column; flex: 1; min-height: 0; }
  #msgs { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 8px; }
  .row { display: flex; }
  .row.mine { justify-content: flex-end; }
  .bubble {
    max-width: 72%; padding: 8px 12px; border-radius: 10px; background: var(--theirs);
    font-size: 14px; line-height: 1.45; word-break: break-word;
  }
  .row.mine .bubble { background: var(--mine); }
  .bubble img { max-width: 100%; max-height: 300px; border-radius: 6px; display: block; cursor: pointer; }
  .meta { font-size: 10px; color: var(--muted); margin-top: 3px; }

  footer { display: flex; gap: 8px; padding: 12px 16px; background: var(--panel); border-top: 1px solid #2a3441; }
  #input {
    flex: 1; background: var(--panel2); border: 1px solid #32404e; color: var(--text);
    border-radius: 8px; padding: 10px 12px; font-size: 14px; resize: none; height: 42px;
  }
  #input:focus { outline: none; border-color: var(--accent); }
  footer button {
    background: var(--accent); color: #fff; border: none; border-radius: 8px;
    padding: 0 18px; font-size: 14px; cursor: pointer;
  }
  #pick { display: none; }
  .icon-btn {
    background: var(--panel2); border: 1px solid #32404e; color: var(--text);
    border-radius: 8px; padding: 0 14px; font-size: 16px; cursor: pointer;
  }
</style>
</head>
<body>
  <header>
    <h1>Fish 私信</h1>
    <span id="status"><span class="dot"></span>未连接</span>
    <span class="spacer"></span>
    <button id="toggle-setup" style="display:none">设置</button>
  </header>

  <!-- 配置面板 -->
  <div id="setup">
    <h2>连接服务器</h2>
    <div>
      <label>服务器地址</label>
      <input id="addr" placeholder="http://服务器IP:19090">
    </div>
    <div>
      <label>密码</label>
      <input id="password" type="password" placeholder="首次输入将创建房间">
    </div>
    <div>
      <label>身份（仅房间内 A/B 都已存在时需要）</label>
      <select id="desired-role">
        <option value="">自动分配</option>
        <option value="A">角色 A</option>
        <option value="B">角色 B</option>
      </select>
    </div>
    <div class="row2">
      <button id="btn-init" class="primary">创建新房间</button>
      <button id="btn-login" class="secondary">已有房间，加入</button>
    </div>
    <div class="err" id="err-msg"></div>
    <p class="hint">
      首次连接此服务器时点击「创建新房间」设置密码，你的设备会成为角色 A。<br>
      之后 B 用相同密码点「加入」即可配对。同一密码房间允许多设备同时在线。
    </p>
  </div>

  <!-- 聊天界面 -->
  <div id="chat">
    <div id="msgs"></div>
    <footer>
      <input type="file" id="pick" accept="image/jpeg,image/png,image/gif,image/webp">
      <button class="icon-btn" id="img-btn" title="发送图片">🖼</button>
      <textarea id="input" placeholder="输入消息，Enter 发送"></textarea>
      <button id="send">发送</button>
    </footer>
  </div>

<script>
const $ = id => document.getElementById(id);
const state = {
  ws: null, token: '', deviceID: '', role: '', peer: '', peerOnline: false,
  addr: '', // 当前消息区所属的服务器地址，切换时需整体重置
  // 本地已收到游标：只存内存。刷新后 DOM 清空 → 游标归零 → 重连走全量拉取。
  localSeq: 0,
  syncing: false,
  pending: new Map() // 乐观气泡 ref -> bubble 元素
};

// 切换服务器 / 身份时调用：DOM 里的气泡和游标都只属于上一个会话，
// 必须一起清掉，否则 sync(after=旧游标) 会漏掉历史、还会串出上一身份的消息。
function resetMessages() {
  $('msgs').innerHTML = '';
  state.localSeq = 0;
  state.syncing = false;
  state.pending.clear();
}

// ---- 本地记忆 ----
function saveCfg() {
  localStorage.setItem('fish.cfg', JSON.stringify({
    addr: $('addr').value,
    deviceID: state.deviceID,
    token: state.token,
    role: state.role,
    peer: state.peer
  }));
}
function loadCfg() {
  try { return JSON.parse(localStorage.getItem('fish.cfg')) || {}; } catch { return {}; }
}
function clearSavedAuth() { localStorage.removeItem('fish.cfg'); }

// ---- 状态栏 ----
function setStatus(on, text) {
  const el = $('status');
  el.classList.toggle('on', !!on);
  el.innerHTML = `<span class="dot"></span>${text}`;
}
function updateStatus() {
  const conn = state.ws && state.ws.readyState === 1;
  const roleLabel = state.role ? `身份 ${state.role}` : '未连接';
  const peerLabel = state.peer ? ` · 对端 ${state.peer} ${state.peerOnline ? '在线' : '离线'}` : '';
  setStatus(conn, roleLabel + peerLabel);
}

// ---- 消息渲染 ----
function bubble(m, mine) {
  const row = document.createElement('div');
  row.className = 'row' + (mine ? ' mine' : '');
  if (m.seq && m.seq !== '…') row.dataset.seq = m.seq;
  const b = document.createElement('div');
  b.className = 'bubble';
  if (m.kind === 'image') {
    const img = document.createElement('img');
    img.src = apiBase() + '/api/files/' + m.file_id + '?token=' + encodeURIComponent(state.token);
    img.onclick = () => window.open(img.src);
    b.appendChild(img);
    const meta = document.createElement('div');
    meta.className = 'meta';
    meta.textContent = `图片 ${m.w || '?'}x${m.h || '?'} · ${fmtSize(m.size)}`;
    b.appendChild(meta);
  } else {
    b.textContent = m.body;
  }
  const meta = document.createElement('div');
  meta.className = 'meta';
  const who = mine ? '我' : ('角色 ' + m.from);
  meta.textContent = `${who} · ${fmtTime(m.ts)} · #${m.seq}`;
  b.appendChild(meta);
  row.appendChild(b);
  return row;
}
function fmtTime(ts) {
  const d = ts ? new Date(ts) : new Date();
  return d.toLocaleTimeString('zh-CN', { hour12: false });
}
function fmtSize(n) { return n < 1024 ? n + 'B' : (n / 1024).toFixed(1) + 'KB'; }
function append(el) {
  $('msgs').appendChild(el);
  $('msgs').scrollTop = $('msgs').scrollHeight;
}
function apiBase() {
  return $('addr').value.trim().replace(/\/+$/, '');
}

// ---- 游标与去重 ----
function markSeq(seq) {
  if (!seq || seq === '…') return;
  if (seq <= state.localSeq || seq > state.localSeq + 1) return;
  state.localSeq = seq;
}
function hasRendered(seq) {
  return !!$('msgs').querySelector('[data-seq="' + seq + '"]');
}
function receiveMessage(m) {
  if (m.seq <= state.localSeq || hasRendered(m.seq)) { markSeq(m.seq); return false; }
  append(bubble(m, m.from === state.role));
  markSeq(m.seq);
  return true;
}

// ---- 连接（init / login / resume 共用）----
function connect(action) {
  const password = $('password').value.trim();
  const desiredRole = $('desired-role').value;

  let did = state.deviceID;
  let token = state.token;

  // resume 模式：需要已有 token 和 device_id；否则必须提供密码
  if (action === 'resume') {
    if (!did || !token) {
      // 本地没保存凭据，不应该走到这里
      clearSavedAuth();
      showSetup();
      return;
    }
  } else {
    if (!password) { showErr('请输入密码'); return; }
    // init 动作不需要 desired_role，login 自动分配
    if (action === 'login' && !did) {
      did = genDeviceID();
    } else if (!did) {
      did = genDeviceID();
    }
  }

  showErr('');
  // 换了服务器地址：旧气泡与旧游标都属于上一台服务器，先整体重置
  const base = apiBase();
  if (state.addr && state.addr !== base) resetMessages();
  state.addr = base;

  state.ws && state.ws.close();
  state.ws = null;
  state.syncing = false;
  state.pending.clear();

  const wsURL = apiBase().replace(/^http/, 'ws') + '/ws';
  let sock;
  try { sock = new WebSocket(wsURL); }
  catch (e) { showErr('地址格式错误，应为 http://IP:端口'); return; }
  state.ws = sock;

  let authSent = false;
  sock.onopen = () => {
    if (state.ws !== sock) return; // 已被更新的连接取代
    setStatus(true, '已连接，鉴权中…');
    const authData = { device_id: did, action };
    if (action !== 'resume') authData.password = password;
    if (action === 'login' && desiredRole) authData.desired_role = desiredRole;
    if (action === 'resume') authData.token = token;
    authSent = true;
    sock.send(JSON.stringify({ v: 1, type: 'auth', ts: Date.now(), data: authData }));
  };
  sock.onmessage = ev => {
    if (state.ws !== sock) return;
    try { handleFrame(JSON.parse(ev.data)); } catch(e) {}
  };
  sock.onclose = () => {
    // 旧连接的异步 onclose 不能影响新连接（否则会把用户踢回设置页）
    if (state.ws !== sock) return;
    state.ws = null;
    setStatus(false, '连接断开');
    state.syncing = false;
    if (authSent && state.role) {
      // 鉴权成功后断开 → 回到设置面板但不清除凭据（下次可 resume）
      $('toggle-setup').style.display = '';
      showSetup();
    } else if (!authSent) {
      showErr('连接失败：服务器不可达');
    }
  };
  sock.onerror = () => {
    if (state.ws === sock) setStatus(false, '连接错误');
  };
}

function genDeviceID() {
  // 浏览器端用 crypto.randomUUID() + 随机串兜底
  try {
    return crypto.randomUUID().replace(/-/g, '');
  } catch {
    return Math.random().toString(16).slice(2) + Date.now().toString(16);
  }
}

function showSetup() {
  $('setup').style.display = 'flex';
  $('chat').style.display = 'none';
}
function showChat() {
  $('setup').style.display = 'none';
  $('chat').style.display = 'flex';
  $('toggle-setup').style.display = '';
}
function showErr(msg) { $('err-msg').textContent = msg || ''; }

function loadHistory() {
  if (state.syncing || !state.ws) return;
  state.syncing = true;
  sendFrame({ v: 1, type: 'sync', data: { after: state.localSeq, limit: 200 } });
}
function sendFrame(f) {
  if (state.ws && state.ws.readyState === 1) state.ws.send(JSON.stringify(f));
}

// ---- 帧处理 ----
function handleFrame(f) {
  switch (f.type) {
    case 'auth.result': {
      const d = f.data || {};
      if (!d.success) {
        setStatus(false, '鉴权失败');
        showErr(d.error || '鉴权失败');
        clearSavedAuth();
        return;
      }
      // 切换了身份：旧身份的消息气泡与游标作废，避免漏拉新身份的历史
      if (state.role && state.role !== d.role) resetMessages();
      state.role = d.role;
      state.peer = state.role === 'A' ? 'B' : 'A';
      state.token = d.token;
      state.deviceID = d.device_id || state.deviceID;
      state.peerOnline = !!d.peer_online;
      // 服务端 last_seq 仅记录，不覆盖本地游标
      showErr('');
      showChat();
      updateStatus();
      saveCfg();
      loadHistory();
      break;
    }
    case 'msg.new': {
      const m = f.data;
      receiveMessage(m);
      sendFrame({ v: 1, type: 'msg.ack', data: { seq: m.seq } });
      break;
    }
    case 'sync.done': {
      state.syncing = false;
      const d = f.data || {};
      for (const m of (d.msgs || [])) receiveMessage(m);
      if (d.has_more) loadHistory();
      break;
    }
    case 'presence': {
      const d = f.data || {};
      if (d.peer === state.peer) {
        state.peerOnline = !!d.online;
        updateStatus();
      }
      break;
    }
    case 'msg.ack': {
      const d = f.data || {};
      if (d.ref) {
        const el = state.pending.get(d.ref);
        if (el && d.seq) {
          el.dataset.seq = d.seq;
          const meta = el.querySelector('.meta');
          if (meta) meta.textContent = meta.textContent.replace('#…', '#' + d.seq);
          markSeq(d.seq);
          state.pending.delete(d.ref);
        }
      }
      break;
    }
    case 'msg.delivered': break;
    case 'pong': break;
    case 'ping': sendFrame({ v: 1, type: 'pong' }); break;
    case 'error': {
      const d = f.data || {};
      if (d.ref && state.pending.has(d.ref)) {
        state.pending.get(d.ref).remove();
        state.pending.delete(d.ref);
      }
      // sync 请求没有 id 无法按 ref 关联，收到错误时解除锁，允许下次重试
      state.syncing = false;
      console.error('服务端错误', d);
      showErr('服务端错误 ' + d.code + ': ' + d.message);
      break;
    }
  }
}

// ---- 发送 ----
function sendText() {
  const text = $('input').value.trim();
  if (!text || !state.ws) return;
  $('input').value = '';
  const ref = 's' + Date.now() + Math.random().toString(36).slice(2, 6);
  const el = bubble({ kind: 'text', body: text, ts: Date.now(), seq: '…', from: state.role }, true);
  state.pending.set(ref, el);
  append(el);
  sendFrame({ v: 1, type: 'msg.send', id: ref, data: { kind: 'text', body: text } });
}

async function sendImage(file) {
  if (!file) return;
  const fd = new FormData();
  fd.append('file', file);
  try {
    const resp = await fetch(apiBase() + '/api/files', {
      method: 'POST',
      headers: { 'Authorization': 'Bearer ' + state.token },
      body: fd
    });
    if (!resp.ok) throw new Error('上传失败 http=' + resp.status);
    const d = await resp.json();
    const ref = 'i' + Date.now() + Math.random().toString(36).slice(2, 6);
    const el = bubble({ kind: 'image', file_id: d.file_id, size: d.size, ts: Date.now(), seq: '…', from: state.role }, true);
    state.pending.set(ref, el);
    append(el);
    sendFrame({
      v: 1, type: 'msg.send', id: ref,
      data: { kind: 'image', file_id: d.file_id, size: d.size }
    });
  } catch (e) {
    showErr(e.message || '图片上传失败');
  }
}

// ---- 事件绑定 ----
$('btn-init').onclick = () => connect('init');
$('btn-login').onclick = () => connect('login');
$('send').onclick = sendText;
$('input').addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendText(); }
});
$('img-btn').onclick = () => $('pick').click();
$('pick').onchange = e => { if (e.target.files[0]) sendImage(e.target.files[0]); e.target.value = ''; };
$('toggle-setup').onclick = () => showSetup();

// 初始化：恢复历史配置 / 自动 resume
(function init() {
  const cfg = loadCfg();
  if (cfg.addr) $('addr').value = cfg.addr;
  if (!cfg.addr) {
    $('addr').value = location.origin.startsWith('http') ? location.origin : 'http://' + location.host;
  }
  // 如果上次保存了 token + device_id，自动 resume
  if (cfg.token && cfg.deviceID && cfg.role) {
    state.deviceID = cfg.deviceID;
    state.token = cfg.token;
    state.role = cfg.role;
    state.peer = cfg.peer;
    setTimeout(() => connect('resume'), 300);
  }
})();

// 心跳保活
setInterval(() => sendFrame({ v: 1, type: 'ping' }), 30000);
</script>
</body>
</html>
